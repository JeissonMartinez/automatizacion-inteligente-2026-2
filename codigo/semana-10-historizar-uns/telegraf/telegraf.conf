# Telegraf · puente entre el broker MQTT (UNS) y la base de series de tiempo
#
# Se suscribe a los tópicos de medición y de salida del UNS, convierte cada
# mensaje JSON en un punto de InfluxDB y lo escribe cada pocos segundos.
#
# SUPUESTO: la jerarquía tiene 8 niveles, como en el Lab 1:
#   empresa/sitio/area/linea/celda/dispositivo/clase/variable
# Si su jerarquía acordada tiene otro número de niveles, ajuste los «+» de
# topics y de topic_parsing, y los nombres de tags (ver la guía, paso 6).

[agent]
  interval = "10s"
  flush_interval = "5s"            # cada 5 s escribe en InfluxDB lo acumulado
  omit_hostname = true

# ---------------------------------------------------------------------------
# ENTRADA 1 · Mediciones y confirmaciones de salida
#   Tópico:  .../esp32-01/medicion/potenciometro
#   Mensaje: {"valor":42.5,"unidad":"%","calidad":"buena"}
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers   = ["tcp://mosquitto:1883"]   # nombre del servicio en la red de Docker
  client_id = "telegraf-medicion"
  username  = "${MQTT_USUARIO}"
  password  = "${MQTT_CLAVE}"
  qos = 0
  topics = [
    "+/+/+/+/+/+/medicion/+",
    "+/+/+/+/+/+/salida/+",
  ]

  data_format = "json"                   # "valor" queda como campo numérico
  tag_keys    = ["unidad", "calidad"]    # los textos pasan a ser etiquetas

  # Cada nivel del tópico se vuelve una etiqueta; la clase es la «medición»
  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "+/+/+/+/+/+/+/+"
    measurement = "_/_/_/_/_/_/measurement/_"
    tags        = "empresa/sitio/area/linea/celda/dispositivo/_/variable"

# ---------------------------------------------------------------------------
# ENTRADA 2 · Estado del dispositivo (online / offline por LWT)
#   Base para calcular disponibilidad (la «D» del OEE) más adelante.
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers   = ["tcp://mosquitto:1883"]
  client_id = "telegraf-estado"
  username  = "${MQTT_USUARIO}"
  password  = "${MQTT_CLAVE}"
  qos = 1
  topics = ["+/+/+/+/+/+/estado"]

  data_format = "value"
  data_type   = "string"                 # el campo se llama "value"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "+/+/+/+/+/+/+"
    measurement = "_/_/_/_/_/_/measurement"
    tags        = "empresa/sitio/area/linea/celda/dispositivo/_"

# ---------------------------------------------------------------------------
# SALIDA · InfluxDB 2
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket       = "${INFLUX_BUCKET}"
