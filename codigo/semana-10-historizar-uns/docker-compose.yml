# Automatización Inteligente — Semana 10 · Historizar el UNS en la nube
# Mismo broker de la semana 7 + base de series de tiempo + tablero.
#
#   Mosquitto  →  Telegraf  →  InfluxDB  →  Grafana
#   (broker)     (puente)     (historiador) (tablero)
#
# Las claves están en el archivo .env (ver .env.ejemplo). No lo suba al repositorio.
#
# Levantar:   docker compose up -d
# Estado:     docker compose ps
# Registros:  docker compose logs --tail 40 telegraf
# Apagar:     docker compose down        (los datos quedan en los volúmenes)

services:

  mosquitto:                      # sin cambios respecto a la semana 7
    image: eclipse-mosquitto:2
    container_name: ai-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:2.7-alpine
    container_name: ai-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"               # interfaz web y API de escritura (opción B con Node-RED)
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup          # solo actúa la primera vez
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USUARIO}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_CLAVE}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d       # el dato se borra solo a los 30 días
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

  telegraf:
    image: telegraf:1.34-alpine
    container_name: ai-telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      MQTT_USUARIO: ${MQTT_USUARIO_TELEGRAF}
      MQTT_CLAVE: ${MQTT_CLAVE_TELEGRAF}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: ai-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_CLAVE}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  simulador:                      # opcional: solo arranca con --profile simulador
    image: eclipse-mosquitto:2
    container_name: ai-simulador
    profiles: ["simulador"]
    depends_on:
      - mosquitto
    environment:
      RUTA_SIMULADOR: ${RUTA_SIMULADOR}
      MQTT_USUARIO: ${MQTT_USUARIO_TELEGRAF}
      MQTT_CLAVE: ${MQTT_CLAVE_TELEGRAF}
    volumes:
      - ./simulador.sh:/simulador.sh:ro
    command: ["sh", "/simulador.sh"]

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  grafana_data:
