# Configuración de Mosquitto para el broker en la nube.
#
# DIFERENCIA CON LA SEMANA 2:
# En el laboratorio teníamos allow_anonymous true. Un puerto 1883
# abierto a internet SIN clave lo encuentran los escáneres en minutos.
# Aquí cada cliente se identifica con usuario y clave.
#
# PENDIENTE (semana 12): cifrado TLS en el puerto 8883 y listas de
# control de acceso (ACL) por equipo. Por ahora las claves viajan
# sin cifrar: no reutilice claves personales.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
