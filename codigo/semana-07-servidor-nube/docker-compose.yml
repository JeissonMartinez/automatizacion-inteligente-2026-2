# Automatización Inteligente — Broker del curso en la nube
# Solo Mosquitto. Node-RED sigue corriendo en el computador de cada equipo.
#
# Levantar:   docker compose up -d
# Ver logs:   docker compose logs -f
# Apagar:     docker compose down

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ai-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (con usuario y clave)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
