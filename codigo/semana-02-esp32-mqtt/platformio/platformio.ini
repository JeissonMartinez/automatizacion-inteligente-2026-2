; Automatización Inteligente (168294) · Universidad de Pamplona
; Laboratorio 1 · Sesión 2B
;
; Uso:
;   pio run -e esp32dev -t upload -t monitor      (ESP32 clásico)
;   pio run -e esp32s3  -t upload -t monitor      (ESP32-S3)
;
; En VS Code con la extensión PlatformIO IDE, el entorno se escoge en la
; barra inferior, junto al ícono de la casa.

[env]
platform = espressif32 @ ~6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    ; Descomente solo la que necesite su sensor:
    ; adafruit/Adafruit MAX31865 library @ ^1.6.2
    ; adafruit/Adafruit MAX31855 library @ ^1.4.2

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
