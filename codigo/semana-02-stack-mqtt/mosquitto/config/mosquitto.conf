# Configuración de Mosquitto para el curso.
#
# ADVERTENCIA DIDÁCTICA:
# allow_anonymous true significa que CUALQUIERA en la red puede
# publicar y suscribirse sin credenciales. Es aceptable en un
# laboratorio aislado y es INACEPTABLE en una planta real.
# En la semana 13 volveremos a este archivo y lo aseguraremos.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
