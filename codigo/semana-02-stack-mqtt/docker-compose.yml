# Automatización Inteligente — Stack del curso
# Semana 2: Mosquitto (broker MQTT) + Node-RED (orquestación de flujos)
# Semana 5: se activan InfluxDB y Grafana (ver el bloque comentado al final)
#
# Levantar:  docker compose up -d
# Ver estado: docker compose ps
# Ver logs:   docker compose logs -f
# Apagar:     docker compose down
# Borrar todo (incluidos datos): docker compose down -v

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ai-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT sobre WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  nodered:
    image: nodered/node-red:4.0
    container_name: ai-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Bogota
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto

